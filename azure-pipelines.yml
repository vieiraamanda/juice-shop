trigger:
  branches:
    include:
      - master  # Ajuste conforme sua branch principal

pool:
  name: Default  # Ou o nome do seu pool de agentes (se você tiver um customizado)

steps:
  - checkout: self  # Faz o checkout do repositório

  # Instalar dependências npm e Snyk
  - script: |
      npm install -g snyk snyk-to-html
      snyk auth $(SNYK_TOKEN)  # A variável de ambiente SNYK_TOKEN deve ser configurada nas secretas do Azure DevOps
    displayName: 'Instalar Snyk e autenticar'

  # Rodar o Snyk Test (verificar vulnerabilidades)
  - script: |
      snyk test --all-projects --json-file-output=results.json
      RESULT=$?
      snyk-to-html -o $(Build.ArtifactStagingDirectory)/results-test.html < results.json
      exit $RESULT
    continueOnError: true
    displayName: 'Rodar Snyk Test'

  # Rodar o Snyk Monitor (enviar para monitoramento contínuo)
  - script: snyk monitor --all-projects
    displayName: 'Rodar Snyk Monitor'