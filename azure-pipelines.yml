pool:
  name: Default

steps:
  - checkout: self

  # install & prepare snyk
  - script: |
      snyk auth $(SNYK_TOKEN)
    displayName: 'snyk auth'

  # snyk code
  - script: snyk code test --org=nova8-cybersecurity-nfr-default
    continueOnError: true
    displayName: 'snyk code'

  # snyk open source
  - script: npm i -g snyk && snyk test --org=nova8-cybersecurity-nfr-default
    continueOnError: true
    displayName: 'snyk test'
  
  # snyk monitor
  - script: npm i -g snyk && snyk monitor --org=nova8-cybersecurity-nfr-default
    continueOnError: true
    displayName: 'snyk monitor'