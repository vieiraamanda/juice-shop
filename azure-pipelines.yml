trigger:
  - master

pool:
  name: Default

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'  # Use a versão mais recente e suportada
    displayName: 'Install Node.js'

  - script: |
      npm install -g snyk
      snyk config set endpoint=https://api.us.snyk.io
      snyk auth $(SNYK_TOKEN)
      snyk test --all-projects
      snyk-monitor --all-projects

    env:
      SNYK_TOKEN: $(SNYK_TOKEN)
    displayName: 'Run Snyk test'