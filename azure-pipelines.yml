pool: Default

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install -g snyk
    snyk config set endpoint=https://api.us.snyk.io
    snyk auth $(SNYK_TOKEN)
  displayName: 'Snyk Install & Auth'

# Snyk Open Source
- script: |
    echo "Rodando Snyk Test"
    snyk test --all-projects --org=nova8-cybersecurity-nfr-default
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Open Source'

# Snyk Monitor
- script: |
    echo "Rodando Snyk Monitor"
    snyk monitor --all-projects --org=nova8-cybersecurity-nfr-default
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Monitor'